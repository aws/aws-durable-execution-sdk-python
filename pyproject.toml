[project]
name = "aws-durable-execution-sdk-python-monorepo"
version = "0.0.0"
requires-python = ">=3.11"

[tool.hatch.envs.default]
workspace.members = ["packages/*"]

[tool.hatch.envs.test]
detached = true
workspace.members = ["packages/*"]
dependencies = [
  "coverage[toml]",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-propagator-aws-xray",
  "aws-durable-execution-sdk-python-testing",
  "PyYAML==6.0.2",
]

[tool.hatch.envs.test.scripts]
all = "pytest {args}"
cov = "pytest --cov-report=term-missing --cov {args}"
examples-integration = "pytest --runner-mode=cloud -m example packages/aws-durable-execution-sdk-python-examples/test/ -v {args}"

[tool.pytest.ini_options]
# Declare custom markers to avoid warnings with --strict-markers
addopts = "-v --strict-markers --import-mode=importlib"
testpaths = [
    "packages/aws-durable-execution-sdk-python/tests",
    "packages/aws-durable-execution-sdk-python-insight/tests",
    "packages/aws-durable-execution-sdk-python-microvm-worker/tests",
    "packages/aws-durable-execution-sdk-python-otel/tests",
    "packages/aws-durable-execution-sdk-python-testing/tests",
    "packages/aws-durable-execution-sdk-python-examples/test",
    "packages/aws-durable-execution-sdk-python-conformance-tests/tests",
    "packages/aws-durable-execution-sdk-python-conformance-tests-otel/tests",
]
markers = [
  # Used for test selection with -m example
  "example: marks tests as example tests (deselect with '-m \"not example\"')",
  # Used for configuration - passes handler and lambda_function_name to durable_runner fixture
  "durable_execution: marks tests that use the durable_runner fixture (not used for test selection)",
]

[tool.hatch.envs.types]
detached = true
workspace.members = ["packages/*"]
extra-dependencies = [
  "mypy>=1.0.0",
  "pytest",
  "boto3-stubs[lambda]",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-propagator-aws-xray",
]

[tool.hatch.envs.types.scripts]
check = "bash .github/scripts/type-checks.sh"

[tool.hatch.envs.dev-core]
workspace.members = ["packages/aws-durable-execution-sdk-python"]
dependencies = [
  "pytest",
  "pytest-cov",
  "coverage[toml]",
  "aws-durable-execution-sdk-python-testing",
  "mypy>=1.0.0",
  "boto3-stubs[lambda]",
]

[tool.hatch.envs.dev-core.scripts]
test = "pytest packages/aws-durable-execution-sdk-python/tests {args}"
cov = "pytest --cov-report=term-missing --cov-config=packages/aws-durable-execution-sdk-python/pyproject.toml --cov=packages/aws-durable-execution-sdk-python/src/aws_durable_execution_sdk_python --cov-fail-under=98 packages/aws-durable-execution-sdk-python/tests {args}"
typecheck = "mypy --install-types --non-interactive packages/aws-durable-execution-sdk-python/src/aws_durable_execution_sdk_python packages/aws-durable-execution-sdk-python/tests"

[tool.hatch.envs.dev-otel]
workspace.members = [
  "packages/aws-durable-execution-sdk-python",
  "packages/aws-durable-execution-sdk-python-otel",
  "packages/aws-durable-execution-sdk-python-testing",
]
dependencies = [
  "pytest",
  "pytest-cov",
  "coverage[toml]",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-propagator-aws-xray",
  "mypy>=1.0.0",
]

[tool.hatch.envs.dev-otel.scripts]
test = "pytest packages/aws-durable-execution-sdk-python-otel/tests {args}"
cov = "pytest --cov-report=term-missing --cov-config=packages/aws-durable-execution-sdk-python-otel/pyproject.toml --cov=packages/aws-durable-execution-sdk-python-otel/src/aws_durable_execution_sdk_python_otel packages/aws-durable-execution-sdk-python-otel/tests {args}"
typecheck = "mypy --install-types --non-interactive packages/aws-durable-execution-sdk-python-otel/src/aws_durable_execution_sdk_python_otel packages/aws-durable-execution-sdk-python-otel/tests"

[tool.hatch.envs.dev-microvm-worker]
workspace.members = ["packages/aws-durable-execution-sdk-python-microvm-worker"]
dependencies = [
  "pytest",
  "pytest-cov",
  "coverage[toml]",
  "mypy>=1.0.0",
  "boto3-stubs[lambda]",
]

[tool.hatch.envs.dev-microvm-worker.scripts]
test = "pytest packages/aws-durable-execution-sdk-python-microvm-worker/tests {args}"
cov = "pytest --cov-report=term-missing --cov-config=packages/aws-durable-execution-sdk-python-microvm-worker/pyproject.toml --cov=packages/aws-durable-execution-sdk-python-microvm-worker/src/aws_durable_execution_sdk_python_microvm_worker packages/aws-durable-execution-sdk-python-microvm-worker/tests {args}"
typecheck = "mypy --install-types --non-interactive packages/aws-durable-execution-sdk-python-microvm-worker/src/aws_durable_execution_sdk_python_microvm_worker packages/aws-durable-execution-sdk-python-microvm-worker/tests"

[tool.hatch.envs.dev-testing]
workspace.members = [
  "packages/aws-durable-execution-sdk-python",
  "packages/aws-durable-execution-sdk-python-testing",
]
dependencies = [
  "pytest",
  "pytest-cov",
  "coverage[toml]",
  "mypy>=1.0.0",
  # .github/scripts/js_examples/run.py reads the JS examples' SAM template.
  "PyYAML==6.0.2",
]

[tool.hatch.envs.dev-testing.scripts]
test = "pytest packages/aws-durable-execution-sdk-python-testing/tests {args}"
cov = "pytest --cov-report=term-missing --cov-config=packages/aws-durable-execution-sdk-python-testing/pyproject.toml --cov=packages/aws-durable-execution-sdk-python-testing/src/aws_durable_execution_sdk_python_testing --cov-fail-under=95 packages/aws-durable-execution-sdk-python-testing/tests {args}"
typecheck = "mypy --install-types --non-interactive packages/aws-durable-execution-sdk-python-testing/src/aws_durable_execution_sdk_python_testing packages/aws-durable-execution-sdk-python-testing/tests"
js-examples = "python .github/scripts/js_examples/run.py {args}"

[tool.hatch.envs.dev-examples]
workspace.members = [
  "packages/aws-durable-execution-sdk-python",
  "packages/aws-durable-execution-sdk-python-examples",
  "packages/aws-durable-execution-sdk-python-otel",
  "packages/aws-durable-execution-sdk-python-testing",
]
dependencies = [
  "pytest",
  "aws-durable-execution-sdk-python-testing",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-propagator-aws-xray",
]

[tool.hatch.envs.dev-examples.scripts]
test = "pytest packages/aws-durable-execution-sdk-python-examples/test {args}"

[tool.hatch.envs.test-pypi-otel]
# Test new exclusivity capability against an installed capable core.
# Legacy valid-registration combinations are verified separately against 2.0.x.
# Override inherited workspace membership: core must come from an installed distribution.
workspace.members = ["packages/aws-durable-execution-sdk-python-otel"]
dependencies = [
  "aws-durable-execution-sdk-python-testing>=1.2.1",
  "aws-durable-execution-sdk-python>=2.1.0",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-propagator-aws-xray",
  "pytest",
  "pytest-cov",
  "coverage[toml]",
]
pre-install-commands = [
  "pip install -e packages/aws-durable-execution-sdk-python-otel",
]

[tool.hatch.envs.test-pypi-otel.scripts]
test = "pytest packages/aws-durable-execution-sdk-python-otel/tests {args}"

[tool.hatch.envs.test-pypi-otel-legacy]
template = "test-pypi-otel"
workspace.members = ["packages/aws-durable-execution-sdk-python-otel"]
dependencies = [
  "aws-durable-execution-sdk-python>=2.0.0,<2.1.0",
  "aws-durable-execution-sdk-python-testing>=1.2.1",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-propagator-aws-xray",
  "pytest",
  "pytest-cov",
  "coverage[toml]",
]

[tool.hatch.envs.test-pypi-otel-legacy.scripts]
test = [
  "python -c 'from pathlib import Path; from importlib.metadata import version; from packaging.version import Version; import aws_durable_execution_sdk_python.execution as core; assert Version(version(\"aws-durable-execution-sdk-python\")).release[:2] == (2, 0); assert \"site-packages\" in Path(core.__file__).resolve().parts; print(version(\"aws-durable-execution-sdk-python\"), core.__file__)' ",
  "pytest packages/aws-durable-execution-sdk-python-otel/tests/e2e/test_view_registration.py -k 'one_view_and_unrelated_plugin_suspend_resume or no_otel_plugin_remains_valid or execution_constructor_retains_ambient_log_correlation' {args}"
]

[tool.hatch.envs.test-pypi-examples]
dependencies = [
  "aws-durable-execution-sdk-python",
  "aws-durable-execution-sdk-python-testing",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-propagator-aws-xray",
  "pytest",
]
pre-install-commands = [
  "pip install -e packages/aws-durable-execution-sdk-python-examples",
]

[tool.hatch.envs.test-pypi-examples.scripts]
test = "pytest packages/aws-durable-execution-sdk-python-examples/test {args}"

[tool.hatch.envs.examples]
workspace.members = [
  "packages/aws-durable-execution-sdk-python",
  "packages/aws-durable-execution-sdk-python-examples",
  "packages/aws-durable-execution-sdk-python-otel",
]

[tool.hatch.envs.examples.scripts]
generate-sam-template = "python packages/aws-durable-execution-sdk-python-examples/scripts/generate_sam_template.py"
build = "python packages/aws-durable-execution-sdk-python-examples/scripts/build_examples.py"
clean = "rm -rf packages/aws-durable-execution-sdk-python-examples/build packages/aws-durable-execution-sdk-python-examples/template.generated.json .aws-sam"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".github/scripts/*.sh", ".github/workflows"]

[tool.ruff.lint]
preview = true
select = ["E4", "E7", "E9", "F", "TID252"]  # pycodestyle (E4/E7/E9) + Pyflakes + absolute imports

[tool.ruff.lint.isort]
known-first-party = [
  "aws_durable_execution_sdk_python",
  "aws_durable_execution_sdk_python_insight",
  "aws_durable_execution_sdk_python_microvm_worker",
  "aws_durable_execution_sdk_python_otel",
  "aws_durable_execution_sdk_python_testing",
]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
  "ARG001",
  "ARG002",
  "ARG005",
  "S101",
  "PLR2004",
  "PLR6301",
  "SIM117",
  "TRY301",
]
"**/test/**" = [
  "ARG001",
  "ARG002",
  "ARG005",
  "S101",
  "PLR2004",
  "SIM117",
  "TRY301",
]
