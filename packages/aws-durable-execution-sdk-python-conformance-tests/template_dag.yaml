AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    Runtime: python3.13
    Timeout: 60
    MemorySize: 128
Resources:
  DurableFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: DurableExecutionPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:CheckpointDurableExecution
            - lambda:GetDurableExecutionState
            Resource: '*'
  DagDiamond:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-1"]
    Properties:
      CodeUri: lambda-build/
      Handler: dag.dag_diamond.handler
      Description: DAG diamond fan-out/fan-in (all tasks complete)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagCompensation:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-2"]
    Properties:
      CodeUri: lambda-build/
      Handler: dag.dag_compensation.handler
      Description: DAG trigger-rule compensation (COMPLETED_WITH_FAILURES)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagRunIf:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-3"]
    Properties:
      CodeUri: lambda-build/
      Handler: dag.dag_run_if.handler
      Description: DAG per-task conditional execution (run_if)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagWaitResume:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-4"]
    Properties:
      CodeUri: lambda-build/
      Handler: dag.dag_wait_resume.handler
      Description: DAG in-graph Wait task (suspend and resume)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
