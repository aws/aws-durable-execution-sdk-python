AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    Runtime: python3.13
    Timeout: 60
    MemorySize: 128
Resources:
  DurableFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: DurableExecutionPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:CheckpointDurableExecution
            - lambda:GetDurableExecutionState
            - lambda:InvokeFunction
            Resource: '*'
  DagDiamond:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-1"]
    Properties:
      CodeUri: lambda-build/
      Handler: dag.dag_diamond.handler
      Description: DAG diamond fan-out/fan-in (all tasks complete)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagCompensation:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-2"]
    Properties:
      CodeUri: lambda-build/
      Handler: dag.dag_compensation.handler
      Description: DAG trigger-rule compensation (COMPLETED_WITH_FAILURES)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagRunIf:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-3"]
    Properties:
      CodeUri: lambda-build/
      Handler: dag.dag_run_if.handler
      Description: DAG per-task conditional execution (run_if)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagWaitResume:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-4"]
    Properties:
      CodeUri: lambda-build/
      Handler: dag.dag_wait_resume.handler
      Description: DAG in-graph Wait task (suspend and resume)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagChild:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-5"]
    Properties:
      CodeUri: lambda-build/
      Handler: dag.dag_child.handler
      Description: DAG task that is a runInChildContext (flat child container)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagMap:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-6"]
    Properties:
      CodeUri: lambda-build/
      Handler: dag.dag_map.handler
      Description: DAG task that is a map over a fixed item list (flat map container)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagParallel:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-7"]
    Properties:
      CodeUri: lambda-build/
      Handler: dag.dag_parallel.handler
      Description: DAG task that is a parallel of two named branches (flat parallel container)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagWaitForCondition:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-8"]
    Properties:
      CodeUri: lambda-build/
      Handler: dag.dag_wait_for_condition.handler
      Description: DAG task that is a waitForCondition (flat WaitForCondition op)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  DagNested:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-9"]
    Properties:
      CodeUri: lambda-build/
      Handler: dag.dag_nested.handler
      Description: DAG task that is itself a nested sub-DAG (flat nested Dag container)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  # Target function for DagInvoke (10-10); no TestingMetadata (not a test itself)
  TargetEcho:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda-build/
      Handler: invoke.target_echo.handler
      Description: Echo target function — returns whatever it receives
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagInvoke:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-10"]
    Properties:
      CodeUri: lambda-build/
      Handler: dag.dag_invoke.handler
      Description: DAG task that is an invoke of another Lambda (flat invoke container)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
      Environment:
        Variables:
          TARGET_FUNCTION_NAME: !Sub "${TargetEcho.Arn}:$LATEST"

  DagCallback:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-11"]
    Properties:
      CodeUri: lambda-build/
      Handler: dag.dag_callback.handler
      Description: DAG task that is a wait-for-callback (flat callback container)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagRunIfAbort:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-12"]
    Properties:
      CodeUri: lambda-build/
      Handler: dag.dag_run_if_abort.handler
      Description: DAG throwing run_if aborts the DAG with a typed error
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagConcurrentOverlap:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-13"]
    Properties:
      CodeUri: lambda-build/
      Handler: dag.dag_concurrent_overlap.handler
      Description: DAG real overlap of two tasks inside one invocation
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagConcurrentSuspend:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-14"]
    Properties:
      CodeUri: lambda-build/
      Handler: dag.dag_concurrent_suspend.handler
      Description: DAG inverted readiness across a suspend (two waits in flight)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
