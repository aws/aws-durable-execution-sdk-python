AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    Runtime: python3.13
    Timeout: 60
    MemorySize: 128
Resources:
  DurableFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: DurableExecutionPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:CheckpointDurableExecution
            - lambda:GetDurableExecutionState
            Resource: '*'
  PluginInvocationLifecycle:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-1"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_invocation_lifecycle.handler
      Description: Plugin invocation lifecycle hooks (start and end)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginOperationLifecycle:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-2"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_operation_lifecycle.handler
      Description: Plugin operation lifecycle hooks (step start and terminal end)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginAttemptHooksRetry:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-3"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_attempt_hooks_retry.handler
      Description: Plugin attempt hooks fire per step attempt under retry
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginErrorIsolation:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-4"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_error_isolation.handler
      Description: Plugin exceptions are swallowed and never affect the outcome
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginMultiplePlugins:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-5"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_multiple_plugins.handler
      Description: Multiple registered plugins all receive lifecycle hooks
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginFirstInvocationFlag:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-6"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_first_invocation_flag.handler
      Description: Plugin sees is-first-invocation true once, then false on replay
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginTerminalFailure:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-7"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_terminal_failure.handler
      Description: Plugin invocation-end hook receives FAILED status on failure
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginOperationChange:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-8"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_operation_change.handler
      Description: Plugin operation-change hook reports updated operations and full map
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginExternalUpdateOnInvoke:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-9"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_external_update_on_invoke.handler
      Description: Plugin sees a wait completed externally between invocations
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginWaitOperationHooks:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-10"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_wait_operation_hooks.handler
      Description: Plugin operation-start and operation-end hooks fire for wait operations
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginNestedParentLinkage:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-11"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_nested_parent_linkage.handler
      Description: Plugin operation hooks report parent id for a step nested in a child context
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginParallelBranchHooks:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-12"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_parallel_branch_hooks.handler
      Description: Plugin user-function hooks fire per parallel branch with parent linkage
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginReplayFlags:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-13"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_replay_flags.handler
      Description: Plugin replay flag on operation-start for non-terminal operations
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginTerminalPayloads:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-14"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_terminal_payloads.handler
      Description: Operation-end info carries the checkpointed result and error
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginRetryExhaustion:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-15"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_retry_exhaustion.handler
      Description: Attempt hooks fire for every attempt until exhaustion, then FAILED
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginSuspensionInvocationEnd:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-16"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_suspension_invocation_end.handler
      Description: Invocation-end fires non-terminal on suspension and terminal at completion
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginFaultyAndHealthy:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-17"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_faulty_and_healthy.handler
      Description: A faulty plugin never blocks another plugin's hooks or the execution
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginWaitReplayFlag:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-18"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_wait_replay_flag.handler
      Description: Plugin observes a still-pending wait with replay=true on re-invocation
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginInvocationInfoShape:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-19"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_invocation_info_shape.handler
      Description: Invocation hooks expose the full invocation info shape
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginOperationInfoShape:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-20"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_operation_info_shape.handler
      Description: Operation hooks expose the full operation info shape
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginAttemptInfoShape:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-21"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_attempt_info_shape.handler
      Description: Attempt hooks expose the full attempt info shape
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginOperationChangeShape:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-22"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_operation_change_shape.handler
      Description: Operation-change hooks expose full delta operation items
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
  PluginContextInfoShape:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-23"]
    Properties:
      CodeUri: lambda-build/
      Handler: plugin.plugin_context_info_shape.handler
      Description: Context hooks expose subtype and children-replay fields
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
