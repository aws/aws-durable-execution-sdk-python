AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Python SDK examples for long-running durable execution OTel conformance

Parameters:
  LambdaExecutionRoleArn:
    Type: String
    Description: Pre-created execution role for the test functions
  OtelLayerArn:
    Type: String
    Description: AWS Distro for OpenTelemetry Python Lambda layer
  OtelExecWrapper:
    Type: String
    Default: /opt/otel-instrument
    Description: Lambda execution wrapper supplied by the exporter profile
  OtelServiceName:
    Type: String
    Default: durable-execution-conformance
    Description: OpenTelemetry resource service name
  OtelView:
    Type: String
    Default: invocation
    AllowedValues:
      - invocation
      - execution
    Description: OpenTelemetry plugin view used by the long-running functions
  OtelTracesExporter:
    Type: String
    Default: otlp
    Description: OpenTelemetry traces exporter selected by the runner

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - x86_64
    Timeout: 60
    MemorySize: 256
    Tracing: Active
    Layers:
      - !Ref OtelLayerArn
    DurableConfig:
      ExecutionTimeout: 180000
      RetentionPeriodInDays: 3
    Environment:
      Variables:
        AWS_LAMBDA_EXEC_WRAPPER: !Ref OtelExecWrapper
        OTEL_SERVICE_NAME: !Ref OtelServiceName
        OTEL_PLUGIN_MODE: !Ref OtelView
        OTEL_TRACES_EXPORTER: !Ref OtelTracesExporter
        OTEL_PROPAGATORS: xray
        OTEL_TRACES_SAMPLER: always_on

Resources:
  OtelLongRunning1Wait:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    TestingMetadata:
      TestDescription:
        - otel-long-running-1
    Properties:
      CodeUri: src/
      Handler: otel_long_running_1_wait.handler
      FunctionName: !Sub "${AWS::StackName}-otel-long-running-1"
      Role: !Ref LambdaExecutionRoleArn

  OtelLongRunning2Retry:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    TestingMetadata:
      TestDescription:
        - otel-long-running-2
    Properties:
      CodeUri: src/
      Handler: otel_long_running_2_retry.handler
      FunctionName: !Sub "${AWS::StackName}-otel-long-running-2"
      Role: !Ref LambdaExecutionRoleArn

  OtelLongRunning3Callback:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    TestingMetadata:
      TestDescription:
        - otel-long-running-3
    Properties:
      CodeUri: src/
      Handler: otel_long_running_3_callback.handler
      FunctionName: !Sub "${AWS::StackName}-otel-long-running-3"
      Role: !Ref LambdaExecutionRoleArn

  OtelLongRunning4ChainedInvoke:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    TestingMetadata:
      TestDescription:
        - otel-long-running-4
    Properties:
      CodeUri: src/
      Handler: otel_long_running_4_chained_invoke.handler
      FunctionName: !Sub "${AWS::StackName}-otel-long-running-4"
      Role: !Ref LambdaExecutionRoleArn
      Environment:
        Variables:
          OTEL_INVOKE_TARGET_FUNCTION_NAME: !Sub "${OtelLongRunning4InvokeTarget.Arn}:$LATEST"

  OtelLongRunning4InvokeTarget:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: src/
      Handler: otel_long_running_4_chained_invoke.target_handler
      FunctionName: !Sub "${AWS::StackName}-otel-long-running-4-target"
      Role: !Ref LambdaExecutionRoleArn
