[build-system]
requires = ["hatchling!=1.32.1,<1.33"]
build-backend = "hatchling.build"

[project]
name = "aws-durable-execution-sdk-python-microvm-worker"
dynamic = ["version"]
description = 'Runs jobs from AWS Lambda durable functions inside an AWS Lambda MicroVM'
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["lambda", "microvm", "durable-execution"]
authors = [{ name = "AWS durable-execution-dev", email = "durable-execution-dev@amazon.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]
# The worker runs inside the MicroVM, not in the durable function. So it does
# not depend on the durable execution SDK. It needs boto3 for the durable
# callback APIs. The MicroVM image installs it, because no Lambda runtime
# provides it there.
dependencies = [
  "boto3>=1.42.1",
]

[project.urls]
Documentation = "https://github.com/aws/aws-durable-execution-sdk-python#readme"
Issues = "https://github.com/aws/aws-durable-execution-sdk-python/issues"
Source = "https://github.com/aws/aws-durable-execution-sdk-python"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_durable_execution_sdk_python_microvm_worker"]

[tool.hatch.build.targets.wheel.force-include]
"../../LICENSE" = "aws_durable_execution_sdk_python_microvm_worker/LICENSE"
"../../NOTICE" = "aws_durable_execution_sdk_python_microvm_worker/NOTICE"

[tool.hatch.version]
path = "src/aws_durable_execution_sdk_python_microvm_worker/__about__.py"

[tool.hatch.publish.index]
disable = true

[tool.coverage.run]
source_pkgs = ["aws_durable_execution_sdk_python_microvm_worker"]
branch = true
parallel = true
omit = ["src/aws_durable_execution_sdk_python_microvm_worker/__about__.py"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
preview = true
select = ["E4", "E7", "E9", "F", "TID252"]

[tool.ruff.lint.isort]
known-first-party = ["aws_durable_execution_sdk_python_microvm_worker"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "ARG005", "S101", "PLR2004", "PLR6301", "SIM117", "TRY301"]
