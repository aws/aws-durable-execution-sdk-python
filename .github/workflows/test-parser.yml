name: Test GitHub Scripts

on:
  pull_request:
    paths:
      - '.github/scripts/build_lambda_layer.py'
      - '.github/scripts/check_otel_wheel_dependencies.py'
      - '.github/scripts/current_latest_version.py'
      - '.github/scripts/parse_sdk_branch.py'
      - '.github/scripts/parse_testing_version.py'
      - '.github/scripts/testing_version.py'
      - '.github/scripts/js_examples/**'
      - '.github/scripts/tests/**'
      - '.github/workflows/ai-pr-review.yml'
      - '.github/workflows/issue-triage.yml'
      - '.github/workflows/notify.yml'
      - '.github/workflows/stale-issue-closer.yml'
      - '.github/workflows/opentelemetry-conformance-tests.yml'
      - '.github/workflows/test-parser.yml'
      - '.github/workflows/ecr-release.yml'
      - 'packages/aws-durable-execution-sdk-python-otel/pyproject.toml'
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/build_lambda_layer.py'
      - '.github/scripts/check_otel_wheel_dependencies.py'
      - '.github/scripts/current_latest_version.py'
      - '.github/scripts/parse_sdk_branch.py'
      - '.github/scripts/parse_testing_version.py'
      - '.github/scripts/testing_version.py'
      - '.github/scripts/js_examples/**'
      - '.github/scripts/tests/**'
      - '.github/workflows/ai-pr-review.yml'
      - '.github/workflows/issue-triage.yml'
      - '.github/workflows/notify.yml'
      - '.github/workflows/stale-issue-closer.yml'
      - '.github/workflows/opentelemetry-conformance-tests.yml'
      - '.github/workflows/test-parser.yml'
      - '.github/workflows/ecr-release.yml'
      - 'packages/aws-durable-execution-sdk-python-otel/pyproject.toml'

permissions:
  contents: read

jobs:
  test-scripts:
    # Fork PRs stay on GitHub-hosted runners so fork code never executes inside
    # the testing account; same-repo PRs, pushes and manual runs go to the
    # CodeBuild-hosted runner (Lambda compute, Amazon Linux python3.13 image).
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || format('codebuild-github-actions-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    env:
      # The runner image ships /etc/pip.conf with `[global] target =
      # /tmp/opt/python/site-packages` on PYTHONPATH; ignore both so the
      # dependency install stays isolated.
      PIP_CONFIG_FILE: /dev/null
      PYTHONPATH: ""
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python
      # The runner image is Amazon Linux; actions/setup-python only ships Ubuntu
      # builds, so uv provides the interpreter and activates a venv.
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.13"
        activate-environment: true

    - name: Install test dependencies
      # build_lambda_layer.py shells out to `python -m pip`; a uv-created venv
      # has no pip, so install it alongside the test dependencies.
      run: uv pip install packaging pytest pip PyYAML==6.0.2

    - name: Run script tests
      run: |
        python -m pytest \
          .github/scripts/tests/test_ai_pr_review_workflow.py \
          .github/scripts/tests/test_build_lambda_layer.py \
          .github/scripts/tests/test_check_otel_wheel_dependencies.py \
          .github/scripts/tests/test_current_latest_version.py \
          .github/scripts/tests/test_js_examples.py \
          .github/scripts/tests/test_opentelemetry_conformance_workflow.py \
          .github/scripts/tests/test_parse_sdk_branch.py \
          .github/scripts/tests/test_parse_testing_version.py \
          .github/scripts/tests/e2e/test_ecr_release_workflow.py \
          .github/scripts/tests/test_shared_workflow_runners.py
