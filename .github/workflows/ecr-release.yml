name: Upload Testing SDK Emulator Image

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  package_path: packages/aws-durable-execution-sdk-python-testing
  aws_region: us-east-1
  ecr_repository_name: durable-functions/aws-durable-execution-emulator

jobs:
  preflight:
    # Decide whether to publish before building anything.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # ECR Public reads require an assumed role
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      should_update_latest: ${{ steps.plan.outputs.should_update_latest }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Parse testing version from the release tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag_version="$(python .github/scripts/parse_testing_version.py)"
          if [[ -z "$tag_version" ]]; then
            echo "Release tag does not name the testing package. Nothing to publish."
          else
            echo "tag names testing version: $tag_version"
          fi

      - name: Require the ECR upload role secret
        if: steps.tag.outputs.tag_version != ''
        env:
          ECR_UPLOAD_IAM_ROLE_ARN: ${{ secrets.ECR_UPLOAD_IAM_ROLE_ARN }}
        run: |
          if [[ -z "$ECR_UPLOAD_IAM_ROLE_ARN" ]]; then
            echo "::error::Secret ECR_UPLOAD_IAM_ROLE_ARN is not set. Restore it before releasing."
            exit 1
          fi

      - name: Verify the tag version matches the source
        id: verify
        if: steps.tag.outputs.tag_version != ''
        shell: bash
        env:
          TAG_VERSION: ${{ steps.tag.outputs.tag_version }}
          ABOUT_PATH: ${{ env.package_path }}/src/aws_durable_execution_sdk_python_testing/__about__.py
        run: |
          source_version="$(grep "^__version__" "$ABOUT_PATH" | cut -d'"' -f2)"
          echo "source version: $source_version"
          if [[ "$TAG_VERSION" != "$source_version" ]]; then
            echo "::error::Release tag names testing-v$TAG_VERSION but __about__.py is $source_version. Aborting before any publish."
            exit 1
          fi
          echo "version=$source_version" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials
        if: steps.tag.outputs.tag_version != ''
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.ECR_UPLOAD_IAM_ROLE_ARN }}
          aws-region: ${{ env.aws_region }}

      - name: Check whether the image tag already exists
        id: exists
        if: steps.tag.outputs.tag_version != ''
        shell: bash
        env:
          VERSION: ${{ steps.verify.outputs.version }}
          ECR_REPOSITORY: ${{ env.ecr_repository_name }}
        run: |
          repo_name="${ECR_REPOSITORY##*/}"
          if err="$(aws ecr-public describe-images \
              --region "${{ env.aws_region }}" \
              --repository-name "$repo_name" \
              --image-ids imageTag="v${VERSION}" 2>&1 >/dev/null)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$err" == *ImageNotFoundException* || "$err" == *ReferencedImagesNotFoundException* ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::describe-images failed for v$VERSION: $err"
            exit 1
          fi

      - name: Emit release plan
        id: plan
        shell: bash
        env:
          TAG_VERSION: ${{ steps.tag.outputs.tag_version }}
          VERSION: ${{ steps.verify.outputs.version }}
          EXISTS: ${{ steps.exists.outputs.exists }}
        run: |
          echo "## Emulator image release plan" >> "$GITHUB_STEP_SUMMARY"

          if [[ -z "$TAG_VERSION" ]]; then
            echo "- decision: **skip** (release does not name the testing package)" >> "$GITHUB_STEP_SUMMARY"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "should_update_latest=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "- testing version: $VERSION" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$EXISTS" == "true" ]]; then
            echo "- image tag v$VERSION: already present in public ECR" >> "$GITHUB_STEP_SUMMARY"
            echo "- decision: **skip build**, reconcile latest and verify (version already published)" >> "$GITHUB_STEP_SUMMARY"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "- image tag v$VERSION: not present in public ECR" >> "$GITHUB_STEP_SUMMARY"
            echo "- decision: **publish**" >> "$GITHUB_STEP_SUMMARY"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "should_update_latest=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-and-upload-image-to-ecr:
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      full_image_arm64: ${{ steps.build-publish.outputs.full_image_arm64 }}
      full_image_x86_64: ${{ steps.build-publish.outputs.full_image_x86_64 }}
      ecr_registry_repository: ${{ steps.build-publish.outputs.ecr_registry_repository }}
      version: ${{ needs.preflight.outputs.version }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Hatch
        run: python -m pip install --upgrade hatch==1.16.5

      - name: Set up QEMU for multi-platform builds
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      - name: Build distribution
        working-directory: ${{ env.package_path }}
        run: hatch build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.ECR_UPLOAD_IAM_ROLE_ARN }}
          aws-region: ${{ env.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - name: Build, tag, and push image to Amazon ECR
        id: build-publish
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr-public.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ecr_repository_name }}
          PER_ARCH_IMAGE_TAG: v${{ needs.preflight.outputs.version }}-${{ matrix.arch }}
        run: |
          docker build --platform "${{ matrix.platform }}" --provenance false "${{ env.package_path }}" -f "${{ env.package_path }}/Dockerfile" -t "$ECR_REGISTRY/$ECR_REPOSITORY:$PER_ARCH_IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$PER_ARCH_IMAGE_TAG"
          echo "ecr_registry_repository=$ECR_REGISTRY/$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "full_image_${{ matrix.arch }}=$ECR_REGISTRY/$ECR_REPOSITORY:$PER_ARCH_IMAGE_TAG" >> "$GITHUB_OUTPUT"

  create-ecr-manifest-per-arch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: [preflight, build-and-upload-image-to-ecr]
    if: always() && needs.preflight.outputs.should_update_latest == 'true' && needs.build-and-upload-image-to-ecr.result != 'failure' && needs.build-and-upload-image-to-ecr.result != 'cancelled'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.ECR_UPLOAD_IAM_ROLE_ARN }}
          aws-region: ${{ env.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - name: Create the version manifest
        id: version-manifest
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          BUILT_THIS_RUN: ${{ needs.build-and-upload-image-to-ecr.result == 'success' }}
          ECR_REGISTRY: ${{ steps.login-ecr-public.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ecr_repository_name }}
        run: |
          repo_name="${ECR_REPOSITORY##*/}"
          base="$ECR_REGISTRY/$ECR_REPOSITORY"
          image_x86_64="$base:v$VERSION-x86_64"
          image_arm64="$base:v$VERSION-arm64"

          # Recovery path: the build was skipped because v$VERSION already exists.
          # Never rewrite a published release manifest from the mutable per-arch
          # tags. Confirm it is present and leave it untouched.
          if [[ "$BUILT_THIS_RUN" != "true" ]]; then
            if aws ecr-public describe-images \
                --region "${{ env.aws_region }}" \
                --repository-name "$repo_name" \
                --image-ids imageTag="v$VERSION" >/dev/null 2>&1; then
              echo "v$VERSION already published, leaving its manifest untouched." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::v$VERSION was expected to exist but is missing, cannot reconcile. Rebuild manually."
            exit 1
          fi

          docker manifest create "$base:v$VERSION" "$image_x86_64" "$image_arm64"
          docker manifest annotate "$base:v$VERSION" "$image_arm64" --arch arm64 --os linux
          docker manifest annotate "$base:v$VERSION" "$image_x86_64" --arch amd64 --os linux
          docker manifest push "$base:v$VERSION"

  update-latest-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: [preflight, create-ecr-manifest-per-arch]
    if: always() && needs.create-ecr-manifest-per-arch.result == 'success'
    # Serialize the latest update so two releases do not race it.
    concurrency:
      group: ecr-release-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.ECR_UPLOAD_IAM_ROLE_ARN }}
          aws-region: ${{ env.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - name: Advance latest to this version when it is newer
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          ECR_REGISTRY: ${{ steps.login-ecr-public.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ecr_repository_name }}
        run: |
          python -m pip install --upgrade packaging
          repo_name="${ECR_REPOSITORY##*/}"
          base="$ECR_REGISTRY/$ECR_REPOSITORY"

          # Confirm this release's own manifest is present before touching latest.
          # It is pushed by a prior job, so allow for registry propagation lag.
          version_visible=""
          for attempt in $(seq 1 10); do
            if aws ecr-public describe-images \
                --region "${{ env.aws_region }}" \
                --repository-name "$repo_name" \
                --image-ids imageTag="v$VERSION" >/dev/null 2>&1; then
              version_visible="true"
              break
            fi
            echo "attempt $attempt: v$VERSION not visible in public ECR yet, retrying."
            sleep 15
          done
          if [[ -z "$version_visible" ]]; then
            echo "::error::v$VERSION manifest not found in public ECR after polling, cannot update latest."
            exit 1
          fi

          # Resolve the version latest currently points at, if any. latest is
          # only ever moved forward, so a backport or a re-run is a no-op.
          # A lookup that fails (rather than returns nothing) must not fall
          # through to an unconditional push: that would let a transient error
          # downgrade latest. Distinguish absent from failed and fail closed.
          if latest_digest="$(aws ecr-public describe-images \
              --region "${{ env.aws_region }}" \
              --repository-name "$repo_name" \
              --image-ids imageTag="latest" \
              --query 'imageDetails[0].imageDigest' --output text 2>/dev/null)"; then
            :
          elif aws ecr-public describe-images \
              --region "${{ env.aws_region }}" \
              --repository-name "$repo_name" \
              --image-ids imageTag="latest" 2>&1 | grep -q "ImageNotFoundException"; then
            latest_digest=""
          else
            echo "::error::Could not read the current latest tag in public ECR, cannot safely update latest."
            exit 1
          fi

          current=""
          if [[ -n "$latest_digest" && "$latest_digest" != "None" ]]; then
            if ! latest_tags="$(aws ecr-public describe-images \
                --region "${{ env.aws_region }}" \
                --repository-name "$repo_name" \
                --image-ids imageDigest="$latest_digest" \
                --query 'imageDetails[0].imageTags[]' --output text)"; then
              echo "::error::Could not read tags for the current latest image, cannot safely update latest."
              exit 1
            fi
            # current is the version latest resolves to, or empty. latest is
            # expected to exist and carry a clean vX.Y.Z, so an empty result
            # here means it resolves to something we cannot order against (a
            # scheme change or a hand-pushed tag). We cannot prove we are newer,
            # so refuse to overwrite latest and leave it for manual review.
            current="$(python .github/scripts/current_latest_version.py $latest_tags)"
            if [[ -z "$current" ]]; then
              echo "::error::latest resolves to no recognized version ($latest_tags), refusing to update latest. Needs manual review."
              exit 1
            fi
          fi

          if [[ -n "$current" ]] && ! python -c "import sys; from packaging.version import Version; sys.exit(0 if Version('$VERSION') > Version('${current#v}') else 1)"; then
            echo "latest points at $current, not advancing for older or equal v$VERSION." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          docker manifest create "$base" "$base:v$VERSION-x86_64" "$base:v$VERSION-arm64"
          docker manifest annotate "$base" "$base:v$VERSION-arm64" --arch arm64 --os linux
          docker manifest annotate "$base" "$base:v$VERSION-x86_64" --arch amd64 --os linux
          docker manifest push "$base"
          echo "latest now points at v$VERSION." >> "$GITHUB_STEP_SUMMARY"

  verify-publish:
    needs: [preflight, update-latest-manifest]
    if: always() && needs.preflight.outputs.should_update_latest == 'true' && needs.update-latest-manifest.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.ECR_UPLOAD_IAM_ROLE_ARN }}
          aws-region: ${{ env.aws_region }}

      - name: Verify the version and latest tags on public ECR
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          ECR_REPOSITORY: ${{ env.ecr_repository_name }}
        run: |
          repo_name="${ECR_REPOSITORY##*/}"
          python -m pip install --upgrade packaging
          digest_for() {
            aws ecr-public describe-images \
              --region "${{ env.aws_region }}" \
              --repository-name "$repo_name" \
              --image-ids imageTag="$1" \
              --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true
          }
          tags_on() {
            aws ecr-public describe-images \
              --region "${{ env.aws_region }}" \
              --repository-name "$repo_name" \
              --image-ids imageDigest="$1" \
              --query 'imageDetails[0].imageTags[]' --output text 2>/dev/null || true
          }
          # latest must resolve to a version at least this release. It is only
          # ever advanced forward, so a newer latest is a valid pass too.
          publish_verified() {
            local v; v="$(digest_for "v${VERSION}")"
            [[ -z "$v" || "$v" == "None" ]] && return 1
            local latest_digest; latest_digest="$(digest_for latest)"
            [[ -z "$latest_digest" || "$latest_digest" == "None" ]] && return 1
            local latest_version
            latest_version="$(python .github/scripts/current_latest_version.py $(tags_on "$latest_digest"))"
            [[ -n "$latest_version" ]] || return 1
            python -c "import sys; from packaging.version import Version; sys.exit(0 if Version('${latest_version#v}') >= Version('${VERSION}') else 1)"
          }
          for attempt in $(seq 1 10); do
            if publish_verified; then
              echo "v$VERSION published and latest points at v$VERSION or newer in public ECR."
              exit 0
            fi
            echo "attempt $attempt: v$VERSION not fully visible in public ECR yet, retrying."
            sleep 15
          done
          final_version="$(digest_for "v${VERSION}")"
          if [[ -z "$final_version" || "$final_version" == "None" ]]; then
            echo "::error::v$VERSION did not become visible in public ECR after publishing."
          else
            latest_digest="$(digest_for latest)"
            latest_version="$(python .github/scripts/current_latest_version.py $(tags_on "$latest_digest"))"
            echo "::error::v$VERSION is published but latest resolves to ${latest_version:-no recognized version}, not this release or newer."
          fi
          exit 1
