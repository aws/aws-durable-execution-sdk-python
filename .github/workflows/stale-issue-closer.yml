name: Stale Issue Closer

on:
  schedule:
    # GitHub can delay scheduled workflows and may drop runs scheduled at the
    # top of the hour during high-load periods.
    - cron: "7 12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  close-stale:
    permissions:
      contents: read
      issues: write
    uses: aws/aws-durable-execution-ci/.github/workflows/stale-issue-closer.yml@e2c39b24e4b57598c993605952e0d71ff1a0eef5
