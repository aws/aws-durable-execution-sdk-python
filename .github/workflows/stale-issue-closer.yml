name: Stale Issue Closer

on:
  schedule:
    # GitHub can delay scheduled workflows and may drop runs scheduled at the
    # top of the hour during high-load periods.
    - cron: "7 12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  close-stale:
    permissions:
      contents: read
      issues: write
    uses: aws/aws-durable-execution-ci/.github/workflows/stale-issue-closer.yml@8a06a1e5c82083a9224af9d489ddd030be44d978
    with:
      # CodeBuild-hosted runner in the Python testing account; the label must
      # match the CodeBuild project name.
      runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
