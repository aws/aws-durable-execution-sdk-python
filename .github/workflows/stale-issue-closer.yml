name: Stale Issue Closer

on:
  schedule:
    # GitHub can delay scheduled workflows and may drop runs scheduled at the
    # top of the hour during high-load periods.
    - cron: "7 12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  close-stale:
    permissions:
      contents: read
      issues: write
    uses: aws/aws-durable-execution-ci/.github/workflows/stale-issue-closer.yml@48b3b4349f7d00a6212b9d959427bd7df81ea99d
