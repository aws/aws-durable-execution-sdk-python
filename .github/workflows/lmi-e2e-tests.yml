name: LMI e2e tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      region:
        description: Region containing the test LMI capacity provider
        default: us-west-2
        type: string

permissions:
  contents: read

env:
  # Ignore the CodeBuild image's shared pip target and Python search path.
  PIP_CONFIG_FILE: /dev/null
  PYTHONPATH: ""
  CONFORMANCE_REVISION: cc1eae152d9d0a49ecb777db140339f290b43567
  LMI_SHARED_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  harness:
    # Keep fork and Dependabot code outside the testing account.
    runs-on: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') && 'ubuntu-latest' || format('codebuild-github-actions-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out pinned shared conformance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aws/aws-durable-execution-conformance-tests
          ref: ${{ env.CONFORMANCE_REVISION }}
          path: .conformance
          persist-credentials: false
      # uv supplies Python on the CodeBuild Amazon Linux image and on Ubuntu.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
          activate-environment: true
      - run: uv pip install hatch==1.16.5
      - run: hatch run lmi:shared-setup
      - run: hatch run lmi:lint
      - run: hatch run lmi:shared-tests --junitxml=lmi_tests/artifacts/unit.xml
      - name: Verify examples workspace initialization
        run: |
          hatch run examples:python - <<'PY'
          from pathlib import Path
          import aws_durable_execution_sdk_python as sdk

          source = Path('packages/aws-durable-execution-sdk-python/src').resolve()
          assert Path(sdk.__file__).resolve().is_relative_to(source), sdk.__file__
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lmi-harness-tests
          path: lmi_tests/artifacts/

  cloud:
    name: cloud (Python 3.14, concurrency 1 and 2)
    needs: harness
    # Trusted PRs and manual runs exercise the shared lifecycle suite. SDK
    # failures remain strict; fork and Dependabot PRs run only the harness.
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    # GitHub Actions is the cross-run concurrency guard. Hold this slot through
    # cleanup and use the same group for every PR/ref targeting this provider.
    concurrency:
      group: lmi-e2e-shared-capacity-provider
      cancel-in-progress: false
      queue: max
    env:
      LMI_STACK_NAME: python-lmi-e2e
      AWS_REGION: ${{ inputs.region || 'us-west-2' }}
      CAPACITY_PROVIDER_ARN: ${{ secrets.CAPACITY_PROVIDER_ARN }}
      TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
      TEST_LAMBDA_EXECUTION_ROLE_ARN: ${{ secrets.TEST_LAMBDA_EXECUTION_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out pinned shared conformance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aws/aws-durable-execution-conformance-tests
          ref: ${{ env.CONFORMANCE_REVISION }}
          path: .conformance
          persist-credentials: false
      # uv supplies Python on the CodeBuild Amazon Linux image and on Ubuntu.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
          activate-environment: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.TEST_ROLE_ARN }}
          role-session-name: python-lmi-e2e
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.TEST_ACCOUNT_ID }}
      - name: Verify test account and prerequisites
        run: |
          test -n "$CAPACITY_PROVIDER_ARN"
          test -n "$TEST_LAMBDA_EXECUTION_ROLE_ARN"
          test "$(aws sts get-caller-identity --query Account --output text)" = "$TEST_ACCOUNT_ID"
      - run: uv pip install hatch==1.16.5
      - run: hatch run lmi:shared-setup
      - name: Build SDK checkout
        timeout-minutes: 5
        run: hatch run lmi:build
      - name: Create or update persistent LMI functions
        timeout-minutes: 35
        env:
          LMI_RUNTIME: python3.14
        run: |
          hatch run lmi:python -m lmi_tests.deploy deploy \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --runtime "$LMI_RUNTIME" --stack-name "$LMI_STACK_NAME"
      - name: Refresh credentials for cloud assertions
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.TEST_ROLE_ARN }}
          role-session-name: python-lmi-assertions
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.TEST_ACCOUNT_ID }}
      - name: Run seven shared lifecycle requirements
        timeout-minutes: 60
        run: hatch run lmi:shared
      - name: Refresh credentials for evidence and cleanup
        if: always() && hashFiles('lmi_tests/artifacts/manifest.json') != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.TEST_ROLE_ARN }}
          role-session-name: python-lmi-cleanup
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.TEST_ACCOUNT_ID }}
      - name: Collect service history and runtime evidence
        if: always()
        timeout-minutes: 5
        run: |
          if test -f lmi_tests/artifacts/manifest.json; then
            hatch run lmi:python -m lmi_tests.deploy collect
          fi
      - name: Release this run's work and retain persistent functions
        if: always()
        timeout-minutes: 5
        run: |
          if test -f lmi_tests/artifacts/manifest.json; then
            hatch run lmi:shared-cleanup
          fi
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lmi-3.14-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: lmi_tests/artifacts/
      - name: Summarize outcomes
        if: always()
        run: |
          python -m lmi_tests.summary >> "$GITHUB_STEP_SUMMARY"
          find lmi_tests/artifacts/shared -name report.json -print 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
