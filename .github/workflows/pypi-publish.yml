# This workflow will upload Python Packages to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload PyPI Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: aws-durable-execution-sdk-python
            path: packages/aws-durable-execution-sdk-python
          - name: aws-durable-execution-sdk-python-otel
            path: packages/aws-durable-execution-sdk-python-otel
          - name: aws-durable-execution-sdk-python-testing
            path: packages/aws-durable-execution-sdk-python-testing
          - name: aws-durable-execution-sdk-python-telemetry-exporter
            path: packages/aws-durable-execution-sdk-python-telemetry-exporter

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Hatch
        run: python -m pip install --upgrade hatch==1.16.5

      - name: Build release distributions
        working-directory: ${{ matrix.package.path }}
        run: hatch build

      - name: Verify legal files in release distributions
        run: python .github/scripts/check_dist_legal_files.py ${{ matrix.package.path }}

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-dists-${{ matrix.package.name }}
          path: ${{ matrix.package.path }}/dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: aws-durable-execution-sdk-python
          - name: aws-durable-execution-sdk-python-otel
          - name: aws-durable-execution-sdk-python-testing
          - name: aws-durable-execution-sdk-python-telemetry-exporter
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/${{ matrix.package.name }}/${{ github.event.release.name }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-dists-${{ matrix.package.name }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  publish-emulator-image:
    # The testing wheel requires the core SDK from this release on PyPI.
    # Keep this in the same run so failed image jobs can be retried after publish.
    needs: pypi-publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ecr-release.yml
    with:
      release_tag: ${{ github.event.release.tag_name }}
    secrets:
      ECR_UPLOAD_IAM_ROLE_ARN: ${{ secrets.ECR_UPLOAD_IAM_ROLE_ARN }}
